<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Crime</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">Crime Management</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item"><a class="nav-link nav-dashboard" href="index.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link nav-report active" href="report.html">Report Crime</a></li>
          <li class="nav-item"><a class="nav-link nav-mycases" href="my-cases.html">My cases</a></li>
          <li class="nav-item"><a class="nav-link nav-admin" href="admin.html">Admin</a></li>
          <li class="nav-item"><a class="nav-link nav-rejected" href="rejected.html">Rejected</a></li>
          <li class="nav-item dropdown d-none" id="navNotifWrap">
            <button class="btn btn-link nav-link dropdown-toggle text-white text-decoration-none py-2" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">
              Alerts <span class="badge bg-danger rounded-pill d-none" id="notifBadge">0</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end shadow border-secondary" style="min-width: 300px; max-height: 380px; overflow-y: auto;" id="notifMenu">
              <li><span class="dropdown-item-text text-secondary small px-3 py-2">Loading…</span></li>
            </ul>
          </li>
          <li class="nav-item"><a class="nav-link nav-register" href="register.html">Register</a></li>
          <li class="nav-item"><a class="nav-link nav-auth" href="login.html">Login</a></li>
          <li class="nav-item ms-lg-2"><span id="navUserBadge" class="user-badge d-none"></span></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <h1 class="page-title">Submit Crime Report</h1>
    <p class="page-subtitle">Provide accurate details so the moderation team can verify and publish incidents quickly.</p>
    <div id="reportAccessMessage" class="mb-3"></div>

    <div class="card form-card p-4">
      <form id="reportForm">
        <div class="mb-3">
          <label for="title" class="form-label">Title</label>
          <input id="title" type="text" class="form-control" placeholder="Enter report title">
        </div>

        <div class="mb-3">
          <label for="description" class="form-label">Description</label>
          <textarea id="description" class="form-control" rows="4" placeholder="Describe the incident"></textarea>
        </div>

        <div class="mb-3">
          <label for="crimeType" class="form-label">Crime Type</label>
          <input id="crimeType" type="text" class="form-control" placeholder="Theft, Assault, etc.">
        </div>

        <div class="row g-3">
          <div class="col-12 col-md-6">
            <label for="latitude" class="form-label">Latitude</label>
            <input id="latitude" type="number" step="any" class="form-control" placeholder="12.9716">
          </div>
          <div class="col-12 col-md-6">
            <label for="longitude" class="form-label">Longitude</label>
            <input id="longitude" type="number" step="any" class="form-control" placeholder="77.5946">
          </div>
        </div>

        <div class="mt-3">
          <label class="form-label">Pick location on map</label>
          <div id="reportMap"></div>
          <small class="text-light">Click on the map to auto-fill latitude and longitude.</small>
        </div>

        <button id="submitReportBtn" type="submit" class="btn btn-primary mt-4">Submit Report</button>
      </form>
      <p id="reportMessage" class="mt-3 mb-0"></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app-shell.js"></script>
  <script src="js/report.js"></script>
</body>
</html>
