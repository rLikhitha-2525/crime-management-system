<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">Crime Management</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item"><a class="nav-link nav-dashboard" href="index.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link nav-report" href="report.html">Report Crime</a></li>
          <li class="nav-item"><a class="nav-link nav-admin" href="admin.html">Admin</a></li>
          <li class="nav-item dropdown d-none" id="navNotifWrap">
            <button class="btn btn-link nav-link dropdown-toggle text-white text-decoration-none py-2" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">
              Alerts <span class="badge bg-danger rounded-pill d-none" id="notifBadge">0</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end shadow border-secondary" style="min-width: 300px; max-height: 380px; overflow-y: auto;" id="notifMenu">
              <li><span class="dropdown-item-text text-secondary small px-3 py-2">Loading…</span></li>
            </ul>
          </li>
          <li class="nav-item"><a class="nav-link nav-register" href="register.html">Register</a></li>
          <li class="nav-item"><a class="nav-link nav-auth active" href="login.html">Login</a></li>
          <li class="nav-item ms-lg-2"><span id="navUserBadge" class="user-badge d-none"></span></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4 auth-shell">
    <h1 class="page-title">Login</h1>
    <p class="page-subtitle">Sign in to submit reports or manage moderation tasks.</p>

    <div class="card form-card p-4">
      <form id="loginForm">
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input id="username" type="text" class="form-control" placeholder="Enter username">
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input id="password" type="password" class="form-control" placeholder="Enter password">
        </div>

        <button id="loginBtn" type="submit" class="btn btn-primary">Login</button>
        <button id="logoutBtn" type="button" class="btn btn-outline-light ms-2">Logout</button>
        <a href="register.html" class="btn btn-outline-info ms-2">Register</a>
      </form>
      <p id="authMessage" class="mt-3 mb-0"></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app-shell.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
