<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My cases</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">Crime Management</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item"><a class="nav-link nav-dashboard" href="index.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link nav-report" href="report.html">Report Crime</a></li>
          <li class="nav-item"><a class="nav-link nav-mycases active" href="my-cases.html">My cases</a></li>
          <li class="nav-item"><a class="nav-link nav-admin" href="admin.html">Admin</a></li>
          <li class="nav-item"><a class="nav-link nav-rejected" href="rejected.html">Rejected</a></li>
          <li class="nav-item dropdown d-none" id="navNotifWrap">
            <button class="btn btn-link nav-link dropdown-toggle text-white text-decoration-none py-2" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">
              Alerts <span class="badge bg-danger rounded-pill d-none" id="notifBadge">0</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end shadow border-secondary" style="min-width: 300px; max-height: 380px; overflow-y: auto;" id="notifMenu">
              <li><span class="dropdown-item-text text-secondary small px-3 py-2">Loading…</span></li>
            </ul>
          </li>
          <li class="nav-item"><a class="nav-link nav-register" href="register.html">Register</a></li>
          <li class="nav-item"><a class="nav-link nav-auth" href="login.html">Login</a></li>
          <li class="nav-item ms-lg-2"><span id="navUserBadge" class="user-badge d-none"></span></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <h1 class="page-title">My cases</h1>
    <p id="myCasesMessage" class="mb-3"></p>
    <p class="page-subtitle">Every report you have filed and its current status. <a href="report.html" class="link-light">Submit a new report</a></p>

    <div class="surface-card">
      <div class="panel-header">
        <h5 class="mb-0">Your reports</h5>
        <span class="text-secondary small" id="myCasesCount">0</span>
      </div>
      <div class="table-responsive mt-2">
        <table class="table table-dark table-striped crime-table mb-0">
          <thead>
            <tr>
              <th>ID</th>
              <th>Status</th>
              <th>Title</th>
              <th>Type</th>
              <th>Description</th>
              <th>Location</th>
              <th>Submitted</th>
            </tr>
          </thead>
          <tbody id="myCasesListBody">
            <tr>
              <td colspan="7" class="text-center text-secondary">Loading…</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app-shell.js"></script>
  <script src="js/my-cases.js"></script>
</body>
</html>
