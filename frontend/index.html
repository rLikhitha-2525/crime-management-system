<!DOCTYPE html>
<html>
<head>
  <title>Crime Alert System</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- ✅ Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

  <style>
    body {
  font-family: Arial;
  background: #0f172a;
  color: white;
  margin: 0;
}

#map {
  height: 400px;
  width: 95%;
  margin: 10px auto;
}

h1 {
  font-size: 20px;
}

@media (min-width: 768px) {
  #map {
    height: 500px;
    width: 80%;
  }

  h1 {
    font-size: 28px;
  }
}
.card {
  border-radius: 10px;
}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="container">
  <h1 class="mt-3 text-center">🚨 Crime Alert Dashboard</h1>
</div>

<div class="container text-center mt-3">
  <div class="row">
    <div class="col">
      <div class="card p-2 bg-dark text-white">
        <h5>Total Crimes</h5>
        <p id="totalCrimes">0</p>
      </div>
    </div>
    <div class="col">
      <div class="card p-2 bg-danger text-white">
        <h5>High Risk Areas</h5>
        <p id="riskAreas">0</p>
      </div>
    </div>
  </div>
</div>

<div id="map"></div>

<canvas id="crimeChart"></canvas>

<!-- ✅ Leaflet JS -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
async function initMap() {

  const map = L.map('map').setView([12.97, 77.59], 12);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
  }).addTo(map);

  try {
    // Fetch crimes
    const res = await fetch("http://127.0.0.1:8000/api/crimes/");
    const crimes = await res.json();

    const typeCount = {};

    crimes.forEach(c => {
      L.marker([c.latitude, c.longitude])
        .addTo(map)
        .bindPopup(c.title);

      // count for chart
      typeCount[c.crime_type] = (typeCount[c.crime_type] || 0) + 1;
    });

    // Fetch alerts
    const alertRes = await fetch("http://127.0.0.1:8000/api/alerts/");
    const alerts = await alertRes.json();

    document.getElementById("totalCrimes").innerText = crimes.length;
document.getElementById("riskAreas").innerText = alerts.high_risk_areas.length;

    alerts.high_risk_areas.forEach(a => {
      const [lat, lng] = a.split("_");

      L.circle([parseFloat(lat), parseFloat(lng)], {
        color: 'red',
        fillColor: '#f03',
        fillOpacity: 0.4,
        radius: 500
      }).addTo(map);
    });
    const predictRes = await fetch("http://127.0.0.1:8000/api/predict/");
const predict = await predictRes.json();

predict.predicted_hotspots.forEach(a => {
  const [lat, lng] = a.split("_");

  L.circle([parseFloat(lat), parseFloat(lng)], {
    color: 'blue',
    fillColor: 'blue',
    fillOpacity: 0.3,
    radius: 700
  }).addTo(map);
});

    // ✅ Toast notification
    if (alerts.high_risk_areas.length > 0) {
      const toast = document.getElementById("toast");
      toast.innerText = `⚠️ ${alerts.high_risk_areas.length} High Risk Areas Detected`;

      toast.style.display = "block";

      setTimeout(() => {
        toast.style.display = "none";
      }, 4000);
    }

    // ✅ Chart
    new Chart(document.getElementById("crimeChart"), {
      type: 'bar',
      data: {
        labels: Object.keys(typeCount),
        datasets: [{
          label: 'Crime Count',
          data: Object.values(typeCount)
        }]
      }
    });

  } catch (error) {
    console.error("Error:", error);
  }
}

initMap();
</script>
<div id="toast" style="
  position: fixed;
  top: 20px;
  right: 20px;
  background: red;
  color: white;
  padding: 15px;
  border-radius: 8px;
  display: none;
  z-index: 1000;
">
  ⚠️ High Risk Area Detected!
</div>
</body>
</html>
