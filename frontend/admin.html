<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">Crime Management</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item"><a class="nav-link nav-dashboard" href="index.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link nav-report" href="report.html">Report Crime</a></li>
          <li class="nav-item"><a class="nav-link nav-admin active" href="admin.html">Admin</a></li>
          <li class="nav-item dropdown d-none" id="navNotifWrap">
            <button class="btn btn-link nav-link dropdown-toggle text-white text-decoration-none py-2" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">
              Alerts <span class="badge bg-danger rounded-pill d-none" id="notifBadge">0</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end shadow border-secondary" style="min-width: 300px; max-height: 380px; overflow-y: auto;" id="notifMenu">
              <li><span class="dropdown-item-text text-secondary small px-3 py-2">Loading…</span></li>
            </ul>
          </li>
          <li class="nav-item"><a class="nav-link nav-register" href="register.html">Register</a></li>
          <li class="nav-item"><a class="nav-link nav-auth" href="login.html">Login</a></li>
          <li class="nav-item ms-lg-2"><span id="navUserBadge" class="user-badge d-none"></span></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <h1 class="page-title">Admin Panel</h1>
    <p id="adminMessage" class="mb-3"></p>
    <p class="page-subtitle">Review new submissions, manage active map cases, and resolve or reject reports. Reporters receive alerts when you approve, reject, or resolve.</p>

    <ul class="nav nav-tabs admin-nav-tabs mb-3" id="adminTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="tab-pending-btn" data-bs-toggle="tab" data-bs-target="#tab-pending" type="button" role="tab" aria-controls="tab-pending" aria-selected="true">Pending review</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="tab-active-btn" data-bs-toggle="tab" data-bs-target="#tab-active" type="button" role="tab" aria-controls="tab-active" aria-selected="false">Active on map</button>
      </li>
    </ul>

    <div class="tab-content" id="adminTabContent">
      <div class="tab-pane fade show active" id="tab-pending" role="tabpanel" aria-labelledby="tab-pending-btn" tabindex="0">
        <div id="pendingReports" class="row g-3">
          <!-- Pending report cards -->
        </div>
      </div>
      <div class="tab-pane fade" id="tab-active" role="tabpanel" aria-labelledby="tab-active-btn" tabindex="0">
        <div id="activeReports" class="row g-3">
          <!-- Active cases -->
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app-shell.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
